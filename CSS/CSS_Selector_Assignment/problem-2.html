<!DOCTYPE html>
<html>
<head>
    <title>Rooms & Suites</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
        }

        .heading {
            text-align: center;
            padding: 30px;
        }

        .heading h1 {
            color: #333;
            font-size: 36px;
        }

        .heading p {
            color: #666;
            font-size: 16px;
        }

        .room-container {
            width: 90%;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .room-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 10px #ccc;
            overflow: hidden;
            text-align: center;
        }

        .room-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .room-name {
            color: #333;
            font-size: 23px;
            margin: 20px 0 10px;
        }

        .price {
            color: #b8860b;
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 20px;
        }

    </style>
</head>

<body>

    <div class="heading">
        <h1>Rooms &amp; Suites</h1>

        <p>
            Experience comfort, luxury and excellent hospitality
            in our beautifully designed rooms and suites.
        </p>
    </div>


    <div class="room-container">

        <div class="room-card">
            <img src="images/single-room.jpg" alt="Single Room">

            <h2 class="room-name">
                Single Room
            </h2>

            <p class="price">
                $90 / PER NIGHT
            </p>
        </div>


        <div class="room-card">
            <img src="images/family-room.jpg" alt="Family Room">

            <h2 class="room-name">
                Family Room
            </h2>

            <p class="price">
                $120 / PER NIGHT
            </p>
        </div>


        <div class="room-card">
            <img src="images/presidential-room.jpg" alt="Presidential Room">

            <h2 class="room-name">
                Presidential Room
            </h2>

            <p class="price">
                $250 / PER NIGHT
            </p>
        </div>

    </div>

</body>
</html>
