<!DOCTYPE html>
<html>
<head>
    <title>Movie Listing Portal</title>

    <style>

        /* Universal Selector */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Element Selector */
        body {
            margin: 0;
            background-color: #f2f2f2;
        }

        /* Grouping Selector */
        h1, h2, p {
            margin-top: 0;
        }

        /* ID Selector */
        #main-heading {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 25px;
            margin-bottom: 25px;
        }

        /* Class Selector */
        .movie-container {
            width: 80%;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .movie-card {
            background-color: white;
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }

        .movie-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .movie-title {
            color: #222;
            font-size: 22px;
            margin: 15px 0 8px;
        }

        .release-date {
            color: #777;
            margin-bottom: 15px;
        }

        .book-button {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .book-button:hover {
            background-color: #b71c1c;
        }

    </style>
</head>

<body>

    <h1 id="main-heading">NOW SHOWING</h1>

    <div class="movie-container">

        <div class="movie-card">
            <img src="images/et.jpg" alt="ET">
            <h2 class="movie-title">ET (2022)</h2>
            <p class="release-date">Releasing on 11 Mar, 2022</p>
            <button class="book-button">Book Tickets</button>
        </div>

        <div class="movie-card">
            <img src="images/jhund.jpg" alt="Jhund">
            <h2 class="movie-title">Jhund</h2>
            <p class="release-date">Releasing on 04 Mar, 2022</p>
            <button class="book-button">Book Tickets</button>
        </div>

        <div class="movie-card">
            <img src="images/gangubai.jpg" alt="Gangubai Kathiawadi">
            <h2 class="movie-title">Gangubai Kathiawadi</h2>
            <p class="release-date">Releasing on 25 Feb, 2022</p>
            <button class="book-button">Book Tickets</button>
        </div>

        <div class="movie-card">
            <img src="images/radhe-shyam.jpg" alt="Radhe Shyam">
            <h2 class="movie-title">Radhe Shyam</h2>
            <p class="release-date">Releasing on 11 Mar, 2022</p>
            <button class="book-button">Book Tickets</button>
        </div>

        <div class="movie-card">
            <img src="images/uncharted.jpg" alt="Uncharted">
            <h2 class="movie-title">Uncharted</h2>
            <p class="release-date">Releasing on 18 Feb, 2022</p>
            <button class="book-button">Book Tickets</button>
        </div>

        <div class="movie-card">
            <img src="images/batman.jpg" alt="The Batman">
            <h2 class="movie-title">The Batman</h2>
            <p class="release-date">Releasing on 04 Mar, 2022</p>
            <button class="book-button">Book Tickets</button>
        </div>

    </div>

</body>
</html>
